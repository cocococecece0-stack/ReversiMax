name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: reversimax2026
      KEY_PASSWORD: reversimax2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test --console=plain

      - name: Assemble release APK
        run: ./gradlew assembleRelease --console=plain

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/reversimax.jks" \
            -alias reversimax \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=ReversiMax, O=ReversiMax, C=RU"

      - name: Align and sign APK
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            ReversiMax-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/reversimax.jks" \
            --ks-key-alias reversimax \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out ReversiMax.apk \
            ReversiMax-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs ReversiMax.apk | head -2

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReversiMax-apk
          path: ReversiMax.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ReversiMax v1.0.${{ github.run_number }}
          body: |
            ReversiMax — Реверси (Отелло) с ИИ на альфа-бета поиске.

            **Как играть:** тапните по подсвеченной клетке, чтобы сходить.
            Режимы сложности: Лёгкий / Средний / Сложный.
          files: ReversiMax.apk
          draft: false
          prerelease: false